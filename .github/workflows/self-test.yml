name: Self-test

# Runs this action from the current checkout. Needs the relay secrets that
# `via auth export` prints on a device enrolled on your relay:
# ASD_TUNNEL_KEY, ASD_TUNNEL_KEY_ID, ASD_TUNNEL_HOST and (optional) ASD_TUNNEL_PORT.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner OS'
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      interface:
        description: 'Interface type'
        default: 'ttyd'
        type: choice
        options:
          - ttyd
          - codeserver
      shell:
        description: 'Shell'
        default: 'bash'
        type: choice
        options:
          - bash
          - zsh
      username:
        description: 'Login username'
        default: 'via'
      password:
        description: 'Login password (empty = generated, shown masked)'
        required: false
      asd-version:
        description: 'Viaalink CLI version (release tag, or latest)'
        default: 'latest'

concurrency:
  group: ci-terminal-${{ github.actor }}
  cancel-in-progress: false

jobs:
  ci-terminal:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          tunnel-key: ${{ secrets.ASD_TUNNEL_KEY }}
          tunnel-key-id: ${{ secrets.ASD_TUNNEL_KEY_ID }}
          tunnel-host: ${{ secrets.ASD_TUNNEL_HOST }}
          tunnel-port: ${{ secrets.ASD_TUNNEL_PORT }}
          interface: ${{ inputs.interface }}
          shell: ${{ inputs.shell }}
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}
          asd-version: ${{ inputs.asd-version }}
