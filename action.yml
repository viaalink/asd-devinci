name: 'Viaalink CI Terminal'
description: 'A browser terminal or VS Code on your CI runner, published through your own Viaalink Relay, behind a login'
author: 'Viaalink'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  tunnel-key:
    description: 'Relay device key (base64), the ASD_TUNNEL_KEY value from `via auth export`. Pass it from a secret.'
    required: false

  tunnel-key-id:
    description: 'Relay device key id, the ASD_TUNNEL_KEY_ID value from `via auth export`. Pass it from a secret.'
    required: false

  api-key:
    description: 'Legacy: provisioning API key. Only used together with api-endpoint; prefer tunnel-key.'
    required: false

  interface:
    description: 'Interface type: ttyd (web terminal) or codeserver (VS Code in browser)'
    default: 'ttyd'

  shell:
    description: 'Shell: bash, zsh, powershell'
    default: 'bash'

  username:
    description: 'Login username'
    default: 'via'

  password:
    description: 'Login password (generated and masked if empty)'
    required: false

  tunnel-name:
    description: 'Name of the session, the first label of its hostname (default: short commit SHA)'
    required: false

  tunnel-host:
    description: 'Relay host, the ASD_TUNNEL_HOST value from `via auth export` (required with tunnel-key)'
    default: ''

  tunnel-port:
    description: 'Relay SSH port, the ASD_TUNNEL_PORT value from `via auth export` (the CLI uses 2222 when empty)'
    default: ''

  region:
    description: 'Legacy: relay region for the provisioning API (api-key mode only)'
    required: false

  ttl-minutes:
    description: 'Legacy: credential lifetime in minutes for the provisioning API (0 = no expiry, api-key mode only)'
    default: '0'

  asd-version:
    description: 'Viaalink CLI release tag to install (3.2 or newer), or latest'
    default: 'latest'

  api-endpoint:
    description: 'Legacy: provisioning API base URL for api-key mode. There is no default service.'
    default: ''

  client-id:
    description: 'Relay client id for password login (with client-secret, tunnel-host and tunnel-port)'
    required: false

  client-secret:
    description: 'Relay client secret for password login (required with client-id)'
    required: false

  direct:
    description: 'Pass --direct to via expose: connect the relay straight to the service, without the login the CLI puts in front'
    default: 'false'

outputs:
  url:
    description: 'Session URL with the login embedded'
    value: ${{ steps.connect.outputs.url }}

  url-base:
    description: 'Session URL without the login'
    value: ${{ steps.connect.outputs.url_base }}

  tunnel-user:
    description: 'Relay client id (empty with tunnel-key)'
    value: ${{ steps.provision.outputs.client_id }}

  local-port:
    description: 'Local service port'
    value: ${{ steps.interface.outputs.port }}

  expires-at:
    description: 'Credential expiry (ISO 8601), when the credential has one'
    value: ${{ steps.provision.outputs.expires_at }}

runs:
  using: 'composite'
  steps:
    - name: Install the Viaalink CLI
      id: install
      shell: bash
      run: bash "${SCRIPTS_DIR}/setup.sh"
      env:
        SCRIPTS_DIR: ${{ github.action_path }}/scripts
        ASD_VERSION: ${{ inputs.asd-version }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}

    - name: Check relay credentials
      id: provision
      shell: bash
      run: bash "${SCRIPTS_DIR}/provision.sh"
      env:
        SCRIPTS_DIR: ${{ github.action_path }}/scripts
        INPUT_TUNNEL_KEY: ${{ inputs.tunnel-key }}
        INPUT_TUNNEL_KEY_ID: ${{ inputs.tunnel-key-id }}
        ASD_API_KEY: ${{ inputs.api-key }}
        ASD_ENDPOINT: ${{ inputs.api-endpoint }}
        ASD_TUNNEL_HOST: ${{ inputs.tunnel-host }}
        ASD_TUNNEL_PORT: ${{ inputs.tunnel-port }}
        TTL_MINUTES: ${{ inputs.ttl-minutes }}
        REGION: ${{ inputs.region }}
        INPUT_CLIENT_ID: ${{ inputs.client-id }}
        INPUT_CLIENT_SECRET: ${{ inputs.client-secret }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}

    - name: Start interface
      id: interface
      shell: bash
      run: bash "${SCRIPTS_DIR}/start-interface.sh"
      env:
        SCRIPTS_DIR: ${{ github.action_path }}/scripts
        INTERFACE_TYPE: ${{ inputs.interface }}
        SESSION_USERNAME: ${{ inputs.username }}
        SESSION_PASSWORD: ${{ inputs.password }}
        SESSION_SHELL: ${{ inputs.shell }}

    # Publishes the session and returns; the tunnel keeps running for the
    # rest of the job. The URL is read back from the CLI, never assembled.
    - name: Publish through the relay
      id: connect
      shell: bash
      run: bash "${SCRIPTS_DIR}/connect.sh"
      env:
        SCRIPTS_DIR: ${{ github.action_path }}/scripts
        TUNNEL_NAME: ${{ inputs.tunnel-name }}
        INTERFACE_TYPE: ${{ inputs.interface }}
        DIRECT_MODE: ${{ inputs.direct }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}

    # `via gh terminal` waits for this artifact to show the URL.
    - name: Upload tunnel URL
      uses: actions/upload-artifact@v4
      with:
        name: tunnel-url
        path: workspace/tunnel-url.txt
        if-no-files-found: error
        retention-days: 1

    - name: Keep session alive
      shell: bash
      run: bash "${SCRIPTS_DIR}/keepalive.sh"
      env:
        SCRIPTS_DIR: ${{ github.action_path }}/scripts
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
